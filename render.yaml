services:
  - type: web
    name: achintya-portfolio
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: achintyajaimini@gmail.com
      - key: CONTACT_FROM_EMAIL
        value: "Achintya Jaimini <achintyajaimini@gmail.com>"
      - key: CONTACT_TO_EMAIL
        value: achintyajaimini@gmail.com
      - key: CONTACT_ALLOWED_ORIGINS
        value: https://achintyajaimini.github.io
      - key: SMTP_PASS
        sync: false
